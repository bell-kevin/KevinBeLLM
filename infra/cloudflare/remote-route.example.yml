# Documentation worksheet only. Remotely managed tunnel routes and Access
# policies are entered in the Cloudflare dashboard; cloudflared does not read
# this file. Replace all example values before following README.md.
tunnel:
  name: asus-kevin-llm
  public_hostname: assistant.example.com
  service: http://127.0.0.1:3000
  protect_with_access: true

access_application:
  type: self-hosted
  hostname: assistant.example.com
  session_duration: 8h
  policy:
    action: allow
    include_exact_emails:
      - owner@example.com
    include_everyone: false
    bypass: false
