name: kevinbellm

services:
  assistant-web:
    build:
      context: ./services/assistant-web
    restart: unless-stopped
    # Host networking reaches the inference/search/tool APIs that remain loopback-only.
    # The app itself also binds loopback, so no LAN port is published.
    network_mode: host
    environment:
      APP_HOST: "127.0.0.1"
      APP_PORT: "${APP_PORT:-3000}"
      PUBLIC_URL: "${PUBLIC_URL:-http://localhost:3000}"
      DATA_DIR: "/data"
      INFERENCE_BACKEND: "${INFERENCE_BACKEND:-llamacpp}"
      INFERENCE_BASE_URL: "${INFERENCE_BASE_URL:-http://127.0.0.1:8080}"
      SEARXNG_URL: "http://127.0.0.1:${SEARXNG_HOST_PORT:-8888}"
      LIVE_TOOLS_URL: "http://127.0.0.1:${LIVE_TOOLS_HOST_PORT:-8090}"
      DEFAULT_MODEL: "${DEFAULT_MODEL:-kevinbellm-9b}"
      PREFERRED_MODELS: "${PREFERRED_MODELS:-kevinbellm-9b,kevinbellm-27b}"
      OLLAMA_CONTEXT_LENGTH: "${OLLAMA_CONTEXT_LENGTH:-16384}"
      CHAT_CONCURRENCY: "${CHAT_CONCURRENCY:-1}"
      CHAT_PENDING: "${CHAT_PENDING:-2}"
      CHAT_QUEUE_TIMEOUT_SECONDS: "${CHAT_QUEUE_TIMEOUT_SECONDS:-30}"
      CHAT_DEADLINE_SECONDS: "${CHAT_DEADLINE_SECONDS:-1200}"
      FETCH_DEADLINE_SECONDS: "${FETCH_DEADLINE_SECONDS:-30}"
      DATABASE_CONCURRENCY: "${DATABASE_CONCURRENCY:-8}"
      SOURCE_URL: "${SOURCE_URL:-https://github.com/bell-kevin/KevinBeLLM}"
    volumes:
      - assistant-data:/data
    depends_on:
      live-tools:
        condition: service_healthy
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=64m,mode=1777
    logging:
      driver: json-file
      options:
        max-size: 10m
    healthcheck:
      test:
        - CMD-SHELL
        - "python -c \"import os,urllib.request; urllib.request.urlopen('http://127.0.0.1:' + os.environ['APP_PORT'] + '/health', timeout=3)\" || exit 1"
      interval: 30s
      timeout: 8s
      retries: 10
      start_period: 20s

  live-tools:
    build:
      context: ./services/live-tools
    restart: unless-stopped
    ports:
      - "127.0.0.1:${LIVE_TOOLS_HOST_PORT:-8090}:8000"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=32m,mode=1777
    # Keep this in Compose as well as the Dockerfile: Podman's default OCI
    # image format discards Dockerfile HEALTHCHECK metadata.
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: 5m

volumes:
  assistant-data:
    name: "${KEVINBELLM_DATA_VOLUME:-kevinbellm-data}"
