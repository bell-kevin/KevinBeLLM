name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: services/assistant-web/requirements-dev.lock

      - name: Install locked test dependencies
        working-directory: services/assistant-web
        run: python -m pip install --require-hashes -r requirements-dev.lock

      - name: Run Python tests
        working-directory: services/assistant-web
        run: python -m pytest -q

      - name: Check shell syntax
        shell: bash
        run: git ls-files -z '*.sh' | xargs -0 -n1 bash -n

      - name: Check standalone inference contract
        shell: bash
        run: bash scripts/check-standalone-contract.sh

      - name: Check browser JavaScript syntax
        run: |
          node --check services/assistant-web/static/app.js
          node --check services/assistant-web/static/login.js

      - name: Check PowerShell syntax
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem scripts/windows -Filter *.ps1 | ForEach-Object {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName,
              [ref]$tokens,
              [ref]$errors
            )
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error $_.Message }
              $failed = $true
            }
          }
          if ($failed) { exit 1 }

      - name: Check public-tree hygiene
        shell: bash
        run: bash scripts/check-public-tree.sh
